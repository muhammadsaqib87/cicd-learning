# ============================================================
# GitHub Actions workflow name
# ============================================================
# This name appears in the repository's GitHub Actions page.
# It helps distinguish this workflow from frontend, deployment,
# linting, security, or other workflows.
name: Backend CI


# ============================================================
# Workflow triggers
# ============================================================
# The "on" section defines when GitHub should start this workflow.
on:

  # ----------------------------------------------------------
  # Push trigger
  # ----------------------------------------------------------
  # Run the workflow whenever commits are pushed directly to
  # either the "dev" branch or the "main" branch.
  #
  # Examples that trigger this workflow:
  #   git push origin dev
  #   git push origin main
  #
  # A push to another branch, such as "feature/login", will not
  # start this workflow unless that branch is added below.
  push:
    branches:
      - dev
      - main

  # ----------------------------------------------------------
  # Pull request trigger
  # ----------------------------------------------------------
  # Run the workflow when a pull request targets either "dev"
  # or "main".
  #
  # The branches listed here are destination branches.
  #
  # Examples:
  #   feature/login -> dev   = workflow runs
  #   dev -> main            = workflow runs
  #   feature/login -> test  = workflow does not run
  #
  # GitHub reruns the workflow when relevant pull request commits
  # are added or updated.
  pull_request:
    branches:
      - dev
      - main

  # ----------------------------------------------------------
  # Manual trigger
  # ----------------------------------------------------------
  # Adds a "Run workflow" button to the GitHub Actions page.
  #
  # This is useful when you want to run the tests without making
  # a new commit or opening a pull request.
  workflow_dispatch:


# ============================================================
# Workflow permissions
# ============================================================
# GitHub Actions workflows receive a temporary GitHub token.
#
# This setting limits that token to read-only repository access.
# The workflow can download the source code but cannot modify
# repository content, create releases, or push commits.
#
# Giving workflows only the permissions they need is a good
# security practice.
permissions:
  contents: read


# ============================================================
# Jobs
# ============================================================
# A workflow can contain one or more jobs.
#
# Jobs run independently unless dependencies are explicitly
# configured with "needs".
jobs:

  # ----------------------------------------------------------
  # Backend testing job
  # ----------------------------------------------------------
  # "backend-tests" is the internal identifier for this job.
  #
  # It appears in the GitHub Actions interface and can also be
  # referenced by other jobs if the workflow is expanded later.
  backend-tests:

    # --------------------------------------------------------
    # Runner operating system
    # --------------------------------------------------------
    # GitHub creates a new temporary Ubuntu virtual machine for
    # this job.
    #
    # The runner is deleted after the job finishes, so every run
    # starts with a clean environment.
    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # Maximum job duration
    # --------------------------------------------------------
    # Stop the job if it runs for more than 15 minutes.
    #
    # This protects the repository from tests or commands that
    # hang indefinitely.
    timeout-minutes: 15

    # --------------------------------------------------------
    # Default settings for shell commands
    # --------------------------------------------------------
    # Every step that uses "run" will execute from the backend
    # directory.
    #
    # Without this setting, commands would start from the root
    # directory of the repository.
    #
    # This default applies to "run" steps only. It does not change
    # how reusable actions such as actions/checkout work.
    defaults:
      run:
        working-directory: backend

    # --------------------------------------------------------
    # Job steps
    # --------------------------------------------------------
    # Steps run from top to bottom.
    #
    # If an important step fails, later steps normally do not run.
    steps:

      # ======================================================
      # Step 1: Check out the repository
      # ======================================================
      # GitHub's runner initially does not contain the repository
      # files.
      #
      # actions/checkout downloads the commit that triggered the
      # workflow and places it on the runner.
      #
      # After this step, directories such as "backend" and files
      # such as "backend/requirements.txt" become available.
      - name: Check out repository
        uses: actions/checkout@v4

      # ======================================================
      # Step 2: Set up Python
      # ======================================================
      # actions/setup-python installs the requested Python version
      # and adds it to the runner's PATH.
      #
      # After this step, commands such as "python" and "pip" use
      # the configured Python version.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:

          # Install Python 3.14.
          #
          # The value is quoted so YAML treats it as a version
          # string rather than a decimal number.
          #
          # Ideally, this should match the Python version used
          # during local development and in production.
          python-version: "3.14"

          # Enable the built-in pip download cache.
          #
          # This can make later workflow runs faster because pip
          # may reuse previously downloaded packages.
          #
          # The cache does not replace dependency installation.
          # The pip install command must still run.
          cache: pip

          # Use this file to calculate the cache key.
          #
          # When requirements.txt changes, GitHub creates a new
          # cache instead of using one based on old dependencies.
          #
          # This path is relative to the repository root, not the
          # backend working directory configured above.
          cache-dependency-path: backend/requirements.txt

      # ======================================================
      # Step 3: Display environment information
      # ======================================================
      # Print the installed Python and pip versions in the logs.
      #
      # This helps diagnose situations where CI uses a different
      # version than the local development environment.
      - name: Show Python and pip versions
        run: |
          python --version
          python -m pip --version

      # ======================================================
      # Step 4: Upgrade pip
      # ======================================================
      # Upgrade pip before installing project dependencies.
      #
      # A newer pip version can improve dependency resolution and
      # support newer Python versions and package formats.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # ======================================================
      # Step 5: Install backend dependencies
      # ======================================================
      # Install every package listed in:
      #
      #   backend/requirements.txt
      #
      # Because the default working directory is "backend", the
      # shorter path "requirements.txt" is correct here.
      #
      # Using "python -m pip" ensures pip belongs to the Python
      # interpreter installed in the previous setup step.
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      # ======================================================
      # Step 6: Run automated tests
      # ======================================================
      # Run pytest as a Python module.
      #
      # The "-v" option enables verbose output, showing individual
      # test names and their results.
      #
      # The command exits with a non-zero status when tests fail.
      # GitHub Actions interprets that as a failed workflow.
      - name: Run backend tests
        run: python -m pytest -v