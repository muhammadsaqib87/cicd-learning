# Name displayed in the GitHub Actions interface.
name: Backend CI

# Events that start this workflow.
on:
  # Run whenever commits are pushed to the dev branch.
  push:
    branches:
      - dev

  # Also run when a pull request is opened or updated
  # and its destination branch is main.
  pull_request:
    branches:
      - main

  # Allow us to run the workflow manually from GitHub.
  workflow_dispatch:

# Give the workflow only the permission needed to read the repository.
permissions:
  contents: read

# Jobs are groups of steps executed by GitHub Actions.
jobs:
  backend-tests:
    # GitHub creates a fresh Linux runner for this job.
    runs-on: ubuntu-latest

    # Commands using "run" will start inside the backend directory.
    defaults:
      run:
        working-directory: backend

    steps:
      # Step 1: Download the repository onto the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Install and activate Python 3.14.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

          # Cache downloaded pip packages to make later runs faster.
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Step 3: Display the Python version in the workflow log.
      - name: Show Python version
        run: python --version

      # Step 4: Install the same dependencies used locally.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 5: Execute all backend automated tests.
      - name: Run backend tests
        run: python -m pytest -v